<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="x-apple-disable-message-reformatting">
    <meta content="telephone=no, date=no, address=no, email=no" name="format-detection">
    <title th:text="${subject}">Your verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a2e;">
<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#f4f4f7;" width="100%">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;max-width:480px;background-color:#ffffff;border-radius:8px;border:1px solid #e2e8f0;"
                   width="480">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:28px 32px 8px;">
                        <span style="font-size:18px;font-weight:700;color:#0f172a;" th:text="${organizationName}">Organization</span>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td align="center" style="padding:16px 32px 8px;">
                        <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;color:#1a1a2e;">Your verification
                            code</h1>
                        <p style="margin:0;font-size:15px;line-height:1.6;color:#475569;">
                            Use the code below to continue. It expires in <strong>5 minutes</strong>.
                        </p>
                    </td>
                </tr>

                <!-- OTP -->
                <tr>
                    <td align="center" style="padding:24px 32px;">
                        <div style="display:inline-block;padding:16px 32px;background-color:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;
                                    font-family:'SF Mono','Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#0f172a;"
                             th:text="${otpCode}">123456
                        </div>
                    </td>
                </tr>

                <!-- Security note -->
                <tr>
                    <td style="padding:0 32px 28px;">
                        <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;text-align:center;">
                            Never share this code with anyone. We will never ask you for it.
                            If you didn't request it, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="padding:20px 32px;background-color:#f8fafc;border-top:1px solid #e2e8f0;border-radius:0 0 8px 8px;">
                        <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                            This is an automated message from <span th:text="${organizationName}">Organization</span>.
                            Please do not reply.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
